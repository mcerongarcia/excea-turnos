<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#8c2430"><title>EXCEA · Inscripción de turnos</title><style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#24272c;background:#f3f4f6}*{box-sizing:border-box}body{margin:0}header{background:#8c2430;color:#fff;padding:13px 16px;display:flex;gap:12px;align-items:center;justify-content:center}header img{width:62px;height:62px;object-fit:contain}header strong{font-size:24px;display:block}header small{font-size:13px}main{max-width:560px;margin:12px auto;padding:0 12px}.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 3px 18px #0000000a}h1{font-size:20px;margin:0 0 16px}h2{font-size:16px;margin:18px 0 8px}label{display:block;font-size:14px;font-weight:650;margin:12px 0 5px}input,select{display:block;width:100%;border:1px solid #cbd0d6;border-radius:10px;padding:12px;font-size:16px;background:#fff;min-height:45px}button{font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.primary{width:100%;background:#8c2430;border:0;color:#fff;font-weight:700;border-radius:11px;padding:14px;margin-top:16px}.result{width:100%;background:#fff;text-align:left;padding:10px 12px;border:1px solid #e0e3e6;border-radius:9px;margin:4px 0}.result.selected{background:#f9e9ec;border-color:#8c2430}.muted{font-size:12px;color:#69737e;margin:6px 0}.shift{border:1px solid #ddd;border-radius:11px;padding:12px;margin:7px 0;display:block;cursor:pointer}.shift:has(input:checked){border:2px solid #8c2430;background:#fff7f8}.shift input{width:auto;min-height:0;display:inline;margin-right:7px}.shift strong{font-size:14px}.shift small{display:block;margin:5px 0 0 24px;color:#65707a}.pill{float:right;font-size:12px;color:#147c45}#status{font-size:14px;min-height:22px;margin-top:10px}.error{color:#ad2330}.success{color:#18733f}footer{text-align:center;color:#777;font-size:11px;padding:20px}#playerResults{max-height:190px;overflow:auto}
</style></head><body><header><img src="logo-excea.png" alt="Logo EXCEA"><div><strong>EXCEA</strong><small>Inscripción de turnos · Familias</small></div></header><main><section class="card"><h1>Inscripción de apoderados</h1><label for="activity">Actividad</label><select id="activity"></select><label for="category">Categoría de la jugadora</label><select id="category"><option value="">Selecciona una categoría</option></select><label for="search">Buscar jugadora</label><input id="search" placeholder="Nombre o apellido" autocomplete="off"><div id="playerResults"></div><p class="muted" id="count"></p><label for="adult">Adulto responsable</label><input id="adult" placeholder="Nombre y apellido" autocomplete="name"><h2>Turnos disponibles</h2><div id="shifts"></div><button class="primary" id="submit" disabled>Confirmar inscripción</button><p id="status" role="status"></p></section></main><footer>EXCEA · Rengo</footer><iframe name="exceaSubmit" id="exceaSubmit" style="display:none" title="Envío de inscripción"></iframe><form id="remoteForm" method="post" target="exceaSubmit" style="display:none"><input name="action" value="register"><input name="jugadoraId"><input name="turnoId"><input name="adulto"></form><script>
// CONFIGURACIÓN: pega la URL de tu implementación Apps Script /exec aquí.
const API_URL='PEGA_AQUI_LA_URL_DE_APPS_SCRIPT_EXEC';
const $=id=>document.getElementById(id);let data={activities:[],players:[],shifts:[]},player='',sending=false;
const clean=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=s=>{const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[3]}/${m[2]}/${m[1]}`:String(s||'')};
const time=s=>String(s||'').replace(/^(\d{4})-(\d{2})-(\d{2})\s*/,(_,y,m,d)=>`${d}/${m}/${y} `);
function msg(s,error=false){$('status').textContent=s;$('status').className=error?'error':'success'}
function load(){if(!API_URL.startsWith('https://')){msg('Configura la URL de Apps Script en index.html.',true);return}const tag=document.createElement('script');tag.src=API_URL+'?action=public&callback=EXCEA_CALLBACK&t='+Date.now();tag.onerror=()=>msg('No fue posible cargar los datos. Revisa el enlace de Apps Script.',true);document.body.appendChild(tag)}
window.EXCEA_CALLBACK=function(payload){if(!payload.ok){msg('Error al cargar datos',true);return}data=payload.data;const a=data.activities||[];$('activity').innerHTML=a.length?a.map(x=>`<option value="${clean(x.id)}">${clean(x.nombre)} · ${clean(date(x.fecha))}</option>`).join(''):'<option value="">Sin actividades publicadas</option>';const cats=[...new Set((data.players||[]).map(p=>p.categoria).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es',{numeric:true}));$('category').innerHTML='<option value="">Selecciona una categoría</option>'+cats.map(x=>`<option value="${clean(x)}">${clean(x)}</option>`).join('');renderPlayers();renderShifts()};
function renderPlayers(){const cat=$('category').value,q=$('search').value.toLocaleLowerCase('es').trim();const list=(data.players||[]).filter(p=>cat&&p.categoria===cat&&p.nombre.toLocaleLowerCase('es').includes(q)).sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));if(!list.some(p=>p.id===player))player='';$('count').textContent=cat?`${list.length} jugadora(s) encontrada(s)`:'Selecciona primero una categoría';$('playerResults').innerHTML=cat?list.slice(0,8).map(p=>`<button type="button" class="result ${player===p.id?'selected':''}" data-player="${clean(p.id)}">${player===p.id?'✓ ':''}${clean(p.nombre)}</button>`).join('')+(list.length>8?'<p class="muted">Escribe más letras para encontrar a la jugadora.</p>':''):'';document.querySelectorAll('[data-player]').forEach(b=>b.onclick=()=>{player=b.dataset.player;$('search').value=(data.players.find(p=>p.id===player)||{}).nombre||'';renderPlayers();check()});check()}
function renderShifts(){const id=$('activity').value;const list=(data.shifts||[]).filter(s=>s.actividadId===id);$('shifts').innerHTML=list.length?list.map(s=>{const free=Math.max(0,Number(s.cupos)-Number(s.ocupados));return `<label class="shift"><input type="radio" name="shift" value="${clean(s.id)}" ${free?'':'disabled'}><strong>${clean(s.funcion)}</strong><span class="pill">${free?free+' cupos':'Completo'}</span><small>${clean(time(s.inicio))} — ${clean(time(s.fin))}</small></label>`}).join(''):'<p class="muted">No hay turnos disponibles para esta actividad.</p>';document.querySelectorAll('[name=shift]').forEach(x=>x.onchange=check);check()}
function check(){$('submit').disabled=sending||!player||$('adult').value.trim().length<3||!document.querySelector('[name=shift]:checked')}
$('activity').onchange=renderShifts;$('category').onchange=()=>{player='';$('search').value='';renderPlayers()};$('search').oninput=()=>{player='';renderPlayers()};$('adult').oninput=check;
$('submit').onclick=()=>{if($('submit').disabled)return;const shift=document.querySelector('[name=shift]:checked');if(!shift)return;sending=true;check();msg('Guardando inscripción…');const f=$('remoteForm');f.action=API_URL;f.elements.jugadoraId.value=player;f.elements.turnoId.value=shift.value;f.elements.adulto.value=$('adult').value.trim();f.submit()};
window.addEventListener('message',e=>{if(!/\.googleusercontent\.com$|\.google\.com$/.test(new URL(e.origin).hostname))return;const p=e.data;if(!p||p.source!=='EXCEA_REGISTER_V8')return;sending=false;if(p.ok){msg('¡Inscripción registrada correctamente!');player='';$('search').value='';$('adult').value='';load()}else{msg(p.error||'No se pudo registrar la inscripción.',true);check()}});
load();</script></body></html>
